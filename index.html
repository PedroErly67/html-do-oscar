<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">

</head>
<link rel="stylesheet" href="css/style.css">
<body>

<h2>loga ai vadia</h2>

<button onclick="document.getElementById('id01').style.display='block'" style="width:auto;">Login</button>

<div id="id01" class="modal">
  
  <form class="modal-content animate" action="/action_page.php" method="post">
    <div class="imgcontainer">
      <span onclick="document.getElementById('id01').style.display='none'" class="close" title="Close Modal">&times;</span>
      <img src="https://i.scdn.co/image/ab67616d00001e027548dc7b793be3adfa0ec8fd" alt="Avatar" class="avatar">
    </div>

    <div class="container">
      <label for="uname"><b>teu nome</b></label>
      <input type="text" placeholder="pare de dar a bunda" name="uname" required>

      <label for="psw"><b>a senha caralho</b></label>
      <input type="password" placeholder="por favor" name="psw" required>
        
      <button type="submit">Login</button>
      <label>
        <input type="checkbox" checked="checked" name="remember"> vai lembrando porra
      </label>
    </div>

    <div class="container" style="background-color:#f1f1f1">
      <button type="button" onclick="document.getElementById('id01').style.display='none'" class="cancelbtn">Cancel</button>
      <span class="psw">Forgot <a href="#">password?</a></span>
    </div>
  </form>
</div>
<script src="js/script.js"></script>
</body>
</html>
